<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SecureBank - Your trusted online banking partner">
    <title>SecureBank - Your Trusted Financial Partner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sticky Navigation -->
    <nav class="nav-sticky" role="navigation" aria-label="Main navigation">
        <div class="nav-logo">
            <label for="nav-logo">Secure Bank</label>
            <img src="./images/bank_logo.jpg" alt="SecureBank Logo" class="logo">
        </div>
        <div class="nav-buttons">
            <button id="signupButton" class="nav-button" aria-label="Sign up">
                Sign Up
            </button>
            <button id="loginButton" class="nav-button" aria-label="Log in">
                Login
            </button>
        </div>
    </nav>

    <!-- Welcome Screen -->
    <main id="welcomeScreen" class="welcome-container">
        <section class="hero" aria-labelledby="welcomeTitle">
            <h1 id="welcomeTitle">Welcome to Secure Bank</h1>
            <p>Your trusted partner in online banking</p>
            <img src="./images/bank_logo.jpg" alt="Banking services illustration" class="hero-image">
        </section>
    </main>

    <!-- Login Form -->
    <div id="loginForm" class="form-container hidden">
        <h2>Login</h2>
        <form id="loginFormElement">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="form-container hidden">
        <h2>Sign Up</h2>
        <form id="signupFormElement">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="id">ID:</label>
            <input type="text" id="id" name="id" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
            
            <label for="country">Country:</label>
            <input type="text" id="country" name="country" required>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
<script src="./includes/script.js"></script>
</html>
